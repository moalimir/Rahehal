# Hamgit verifies the exact main commit approved and merged on GitHub.
# Keep commands aligned with .github/workflows/ci.yml; no deployment or sync
# credentials belong in this pipeline. Requires a Linux Docker executor.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - verify

default:
  image: node:22-bookworm
  interruptible: true
  timeout: 30 minutes
  before_script:
    - node -e 'const fs = require("node:fs"); const pin = fs.readFileSync(".nvmrc", "utf8").trim(); if (process.versions.node.split(".")[0] !== pin) throw new Error("CI image must match .nvmrc");'
    - npm ci --include=optional

source:
  stage: verify
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:check
    - npm test
    - npm run analyze:source:check
    - npm run verify:boundaries
    - npm run verify:vocabulary

database:
  stage: verify
  services:
    - name: postgres:16.15-alpine3.24
      alias: postgres
  variables:
    POSTGRES_DB: rahhal
    POSTGRES_USER: rahhal
    # Synthetic credential for the isolated job service, not a deployed database.
    POSTGRES_PASSWORD: rahhal-local-only
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    RAHHAL_POSTGRES_PORT: "5432"
    RAHHAL_TEST_DATABASE_ADMIN_URL: postgresql://rahhal:rahhal-local-only@127.0.0.1:5432/postgres
  script:
    - apt-get update && apt-get install -y --no-install-recommends socat
    # Preserve the testkit's loopback-only destructive-test safety guard. This
    # forward exists only inside this job and targets only its ephemeral service.
    - |
      socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:postgres:5432 &
      rahhal_ci_proxy_pid=$!
      trap 'kill "$rahhal_ci_proxy_pid"' EXIT
      npm run test:postgres

build:
  stage: verify
  script:
    - npm run build
    - npm run verify:routes
    - npm run verify:links
    - npm run test:smoke
    - npm run verify:offline
    - npm run test:standalone-interactive
    - npm run check:budgets
    - npm run build:web:network
    - npm run check:budgets:network
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - out/
      - index.html
      - apps/api/dist/
      - apps/worker/dist/
      - packages/contracts/dist/openapi.json

browser:
  stage: verify
  script:
    - npx playwright install --with-deps chromium
    - npm run build:web
    - npm run test:browser

security:
  stage: verify
  script:
    - npm audit --audit-level=high
