name: CI

# Release pipeline (85_DEVELOPMENT_GUIDE.md §8). Runs every release gate on the pinned
# runtime; every job here is required. Visual regression (T-E in
# project-documents/82_PHASE0_COMPLETION.md) is a separate, manually-triggered
# workflow (visual.yml) until a reviewed Golden Master exists — it cannot pass
# without one, so running it on every push was pure cost with zero signal.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run analyze:source:check
      - run: npm run verify:boundaries
      - run: npm run verify:vocabulary

  # The authoritative layer. `npm test` deliberately excludes these suites --
  # they need a real PostgreSQL -- so without this job every adapter behind
  # A1a-B5 (atomic evidence, append-only triggers, publish races, public
  # projection isolation) would ship unguarded.
  database:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: rahhal
          POSTGRES_USER: rahhal
          POSTGRES_PASSWORD: rahhal-local-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rahhal -d rahhal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Same resolution path the local runs use, so a divergence between the
      # published Compose port and the suites' default cannot come back.
      RAHHAL_POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npm run test:postgres

  build:
    name: Build & static verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build
      - run: npm run verify:generated
      - run: npm run verify:routes
      - run: npm run verify:links
      - run: npm run test:smoke
      - run: npm run verify:offline
      - run: npm run test:standalone-interactive
      - run: npm run check:budgets
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            out/
            index.html
            apps/api/dist/
            apps/worker/dist/
            packages/contracts/dist/openapi.json
          retention-days: 7

  browser:
    name: Browser behavior (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:browser

  security:
    name: Dependency & security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - name: npm audit (high+)
        run: npm audit --audit-level=high
